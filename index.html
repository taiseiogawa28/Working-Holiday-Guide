<!DOCTYPE html>
<html lang="en">
    <head>
    <!-- ユーザーには見えない設定部分 -->
        <meta charset="UTF-8"> 
        <!-- 日本語を正しく表示(文字化け防止) -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <!-- スマホでも見やすくする設定 -->
        <title>Working Holiday Guide</title> 
        <!-- ブラウザのタブに表示される名前 -->
        <link rel="stylesheet" href="style.css"> 
        <!-- style.cssの読み込み -->
    </head>
        <body> 
        <!-- 出力画面部分の開始 -->
            <div class="app-container">  <!--  画面全体を囲む箱を設置 -->
                <div class="language-switcher">
                    <button id="language-toggle-button" aria-label="Switch display language to Japanese">日本語</button>
                </div>

                <h1>🌎Working Holiday Guide<br> 
                    <span id="app-subtitle">- For Japanese -</span>
                </h1>  <!-- hは見出しheading -->

            <!-- 進捗状況の表示部分を囲む箱を設置 -->
                <div class="progress-section">
                    <div class="progress-info">
                        <p id="progress-text">Progress: 0%</p>
                        <p id="remaining-tasks">Remaining: 0</p>
                    </div>

                    <div class="progress-container">
                        <div id="progress-bar"></div>
                    </div>
                </div>

                <div class="task-filters">
                    <button id="filter-all">All</button>
                    <button id="filter-active">Active</button>
                    <button id="filter-completed">Completed</button>
                </div>

                <h2 id="pre-arrival-heading">Pre-arrival Tasks</h2>  <!-- 中見出し -->
                
                <div class="task-input-area"> <!-- divで箱を設置 -->
                    <input type="text" id="new-pre-task-input" placeholder="Enter a new pre-arrival task">  <!-- タスクの入力欄 -->
                    <button id="add-pre-task-button">Add Task</button> <!-- Add Task ボタン -->
                </div>

                <ul id="pre-arrival-list"> <!-- リスト(箇条書き)の開始 -->
                </ul>
                <!-- リスト(箇条書き終了) --> 
                
            
                <h2 id="post-arrival-heading">Post-arrival Tasks</h2>

                <div class="task-input-area">      <!-- divで箱を設置 -->
                    <input
                        type="text"
                        id="new-post-task-input"
                        placeholder="Enter a new post-arrival task"
                    >
                    <!-- タスクの入力欄 -->

                    <button id="add-post-task-button">   <!--  Add Task ボタン-->
                        Add Task
                    </button>
                </div>

                <ul id="post-arrival-list">
                </ul>     
            
           </div>
            <script src="script.js"></script>  <!--　JavaScriptを読み込む -->

        </body>
        <!-- 画面部分終了 -->
</html>
